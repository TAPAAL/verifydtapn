name: Build Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  

concurrency: 
  group: build-Linux-${{ github.head_ref }}
  cancel-in-progress: true

env:
  GCC_VERSION: 16

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7.0.1
    
    - name: ubuntu install depends
      run: |
        sudo apt update
        sudo apt install -f flex bison ninja-build gcc-${GCC_VERSION} g++-${GCC_VERSION}
        echo "CC=gcc-${GCC_VERSION}" >> "$GITHUB_ENV"
        echo "CXX=g++-${GCC_VERSION}" >> "$GITHUB_ENV"

    - name: Build Release
      run: cmake --workflow release

    - name: Test
      run: cmake --workflow test

    - name: Upload artifacts 
      uses: actions/upload-artifact@v7.0.1
      with:
        name: verifydtapn-linux64
        path: '${{github.workspace}}/build-release/verifydtapn/bin/verifydtapn-linux64'
